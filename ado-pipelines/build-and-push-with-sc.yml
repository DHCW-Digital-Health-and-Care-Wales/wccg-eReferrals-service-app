# ado-pipelines/build-and-push-with-sc.yml
#
# Build, test, and push the NWRI eReferrals Service API Docker image to ACR.
# Uses Azure RM service connection for authentication.
#
# Prerequisites:
#   1. Azure RM service connection (Managed Identity) created in ADO
#   2. Variable group 'nwri-ereferrals-dev' with 'azureSubscription' variable set to the SC name

trigger:
  branches:
    include:
      - main

pool:
  name: UKS-DHCW-NWRI-DEV-ADOSelfHostPool

variables:
  - name: buildConfiguration
    value: "Release"
  - name: solutionFile
    value: "NWRI.eReferralsService.sln"
  - name: unitTestProject
    value: "test/NWRI.eReferralsService.Unit.Tests/NWRI.eReferralsService.Unit.Tests.csproj"
  - name: dockerfilePath
    value: "src/NWRI.eReferralsService.API/Dockerfile"
  - name: dockerBuildContext
    value: "src/NWRI.eReferralsService.API"
  - group: nwri-ereferrals-dev

steps:
  - checkout: self
    displayName: "Checkout source code"

  - task: DotNetCoreCLI@2
    displayName: "Restore NuGet packages"
    inputs:
      command: "restore"
      projects: "$(solutionFile)"

  - task: DotNetCoreCLI@2
    displayName: "Build solution"
    inputs:
      command: "build"
      projects: "$(solutionFile)"
      arguments: "--no-restore --configuration $(buildConfiguration)"

  - task: DotNetCoreCLI@2
    displayName: "Run unit tests"
    inputs:
      command: "test"
      projects: "$(unitTestProject)"
      arguments: >
        --no-restore
        --no-build
        --configuration $(buildConfiguration)
        --collect "XPlat Code Coverage"
        --settings coverlet.runsettings
      publishTestResults: true

  - task: PublishCodeCoverageResults@2
    displayName: "Publish code coverage"
    condition: always()
    inputs:
      summaryFileLocation: "$(Agent.TempDirectory)/**/coverage.cobertura.xml"

  - task: AzureCLI@2
    displayName: "Build and push Docker image to ACR"
    condition: succeeded()
    inputs:
      azureSubscription: "$(azureSubscription)"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        set -euo pipefail

        echo "Authenticating to ACR $(acrLoginServer)..."
        az acr login --name $(acrName)

        IMAGE_FULL="$(acrLoginServer)/$(imageName)"
        COMMIT_TAG="$(Build.SourceVersion)"

        echo "Building Docker image..."
        echo "  Image: ${IMAGE_FULL}"
        echo "  Tags:  latest, ${COMMIT_TAG}"

        docker build \
          -t "${IMAGE_FULL}:latest" \
          -t "${IMAGE_FULL}:${COMMIT_TAG}" \
          -f "$(dockerfilePath)" \
          "$(dockerBuildContext)"

        echo "Pushing Docker image..."
        docker push "${IMAGE_FULL}:latest"
        docker push "${IMAGE_FULL}:${COMMIT_TAG}"

        echo "============================================"
        echo " Docker image pushed successfully"
        echo " Repository: ${IMAGE_FULL}"
        echo " Tags:       latest, ${COMMIT_TAG}"
        echo "============================================"
