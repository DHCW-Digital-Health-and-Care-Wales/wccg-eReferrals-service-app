pool:
  name: UKS-DHCW-NWRI-DEV-ADOSelfHostPoolVM

trigger: none

variables:
  - group: nwri-ereferrals-dev


steps:
  - task: AzureCLI@2
    displayName: "Test ACR"
    inputs:
      azureSubscription: $(azureSubscription)
      scriptType: "ps"
      scriptLocation: "inlineScript"
      inlineScript: |
        Write-Host "Authenticating to ACR $(acrLoginServer)..."
        az acr login --name $(acrName)

        Write-Host "`n========================================" -ForegroundColor Cyan
        Write-Host "  ACR Image Inventory: $(acrLoginServer)" -ForegroundColor Cyan
        Write-Host "========================================`n" -ForegroundColor Cyan

        $repositories = az acr repository list --name $(acrName) --output json | ConvertFrom-Json

        if (-not $repositories -or $repositories.Count -eq 0) {
          Write-Host "No repositories found in $(acrName)." -ForegroundColor Yellow
          exit 0
        }

        Write-Host "Found $($repositories.Count) repository/repositories.`n"

        $grandTotal = 0

        foreach ($repo in $repositories) {
          Write-Host "----------------------------------------" -ForegroundColor DarkCyan
          Write-Host "Repository: $repo" -ForegroundColor Green

          $manifests = az acr manifest list-metadata `
            --registry $(acrName) `
            --name $repo `
            --orderby time_desc `
            --output json | ConvertFrom-Json

          if (-not $manifests -or $manifests.Count -eq 0) {
            Write-Host "  (no manifests found)" -ForegroundColor DarkGray
            continue
          }

          Write-Host "  Total images (manifests): $($manifests.Count)"
          $grandTotal += $manifests.Count

          foreach ($manifest in $manifests) {
            Write-Host ""
            Write-Host "  Digest    : $($manifest.digest)" -ForegroundColor White
            Write-Host "  Tags      : $(if ($manifest.tags) { $manifest.tags -join ', ' } else { '(untagged)' })"
            Write-Host "  Created   : $($manifest.createdTime)"
            Write-Host "  Updated   : $($manifest.lastUpdateTime)"
            Write-Host "  OS/Arch   : $($manifest.operatingSystem)/$($manifest.architecture)"
            Write-Host "  Media type: $($manifest.mediaType)"

            $sizeMB = [math]::Round($manifest.imageSize / 1MB, 2)
            Write-Host "  Size      : $sizeMB MB"

            if ($manifest.changeableAttributes) {
              Write-Host "  Read-only : $($manifest.changeableAttributes.readEnabled -eq $false)"
              Write-Host "  Delete    : $($manifest.changeableAttributes.deleteEnabled)"
              Write-Host "  Write     : $($manifest.changeableAttributes.writeEnabled)"
              Write-Host "  List      : $($manifest.changeableAttributes.listEnabled)"
            }
          }
          Write-Host ""
        }

        Write-Host "========================================"
        Write-Host "Grand total images across all repos: $grandTotal"
        Write-Host "========================================"
