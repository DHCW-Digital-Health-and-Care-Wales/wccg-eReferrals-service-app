# ado-pipelines/build-and-push.yml
#
# Build, test, and push the NWRI eReferrals Service API Docker image to ACR.

trigger:
  branches:
    include:
      - main

pool:
  name: UKS-DHCW-NWRI-DEV-ADOSelfHostPoolVM

variables:
  - name: buildConfiguration
    value: "Release"
  - name: solutionFile
    value: "NWRI.eReferralsService.sln"
  - name: unitTestProject
    value: "test/**/*.csproj"
  - name: dockerfilePath
    value: "src/NWRI.eReferralsService.API/Dockerfile"
  - name: dockerBuildContext
    value: "src/NWRI.eReferralsService.API"
  - group: nwri-ereferrals-dev

steps:
  - checkout: self
    displayName: "Checkout source code"

  - task: UseDotNet@2
    displayName: "Use .NET SDK 8.0"
    inputs:
      packageType: "sdk"
      version: "8.0.x"

  - task: DotNetCoreCLI@2
    displayName: "Restore NuGet packages"
    inputs:
      command: "restore"
      projects: "$(solutionFile)"

  - task: DotNetCoreCLI@2
    displayName: "Build solution"
    inputs:
      command: "build"
      projects: "$(solutionFile)"
      arguments: "--no-restore --configuration $(buildConfiguration)"

  - task: DotNetCoreCLI@2
    displayName: "Run unit tests"
    inputs:
      command: "test"
      projects: "$(unitTestProject)"
      arguments: >
        --no-restore
        --no-build
        --configuration $(buildConfiguration)
        --collect "XPlat Code Coverage"
        --settings coverlet.runsettings
      publishTestResults: true

  - task: PublishCodeCoverageResults@2
    displayName: "Publish code coverage"
    condition: always()
    inputs:
      summaryFileLocation: "$(Agent.TempDirectory)/**/coverage.cobertura.xml"

  - task: AzureCLI@2
    displayName: "Build and push Docker image to ACR"
    condition: succeeded()
    inputs:
      azureSubscription: $(azureSubscription)
      scriptType: "ps"
      scriptLocation: "inlineScript"
      inlineScript: |
        Write-Host "Authenticating to ACR $(acrLoginServer)..."
        az acr login --name $(acrName)

        $imageFull = "$(acrLoginServer)/$(imageName)"
        $commitTag = "$(Build.SourceVersion)"

        Write-Host "Building Docker image..."
        Write-Host "  Image: $imageFull"
        Write-Host "  Tags:  latest, $commitTag"

        docker build `
          -t "${imageFull}:latest" `
          -t "${imageFull}:${commitTag}" `
          -f "$(dockerfilePath)" `
          "$(dockerBuildContext)"

        Write-Host "Pushing Docker image..."
        docker push "${imageFull}:latest"
        docker push "${imageFull}:${commitTag}"

        Write-Host "============================================"
        Write-Host " Docker image pushed successfully"
        Write-Host " Repository: $imageFull"
        Write-Host " Tags:       latest, $commitTag"
        Write-Host "============================================"
