# ado-pipelines/deploy.yml
#
# Deploy the NWRI eReferrals Service API to Azure Container Apps.
# Uses managed identity on the self-hosted agent (no service connection required).
#
# If you have an Azure RM service connection, use deploy-with-sc.yml instead.

trigger: none

parameters:
  - name: imageTag
    displayName: "Docker image tag to deploy (commit SHA or 'latest')"
    type: string
    default: "latest"

pool:
  name: UKS-DHCW-NWRI-DEV-ADOSelfHostPool

variables:
  - name: healthCheckMaxAttempts
    value: 30
  - name: healthCheckIntervalSeconds
    value: 10
  - group: nwri-ereferrals-dev

steps:
  - script: |
      set -euo pipefail

      echo "Authenticating with managed identity..."
      az login --identity --allow-no-subscriptions

      IMAGE_REF="$(acrLoginServer)/$(imageName):${{ parameters.imageTag }}"
      REVISION_SUFFIX="v$(Build.BuildId)"

      echo "============================================"
      echo " Deploying to Container App"
      echo " App:      $(containerAppName)"
      echo " Image:    ${IMAGE_REF}"
      echo " Revision: ${REVISION_SUFFIX}"
      echo "============================================"

      az containerapp update \
        --name "$(containerAppName)" \
        --resource-group "$(resourceGroup)" \
        --image "${IMAGE_REF}" \
        --revision-suffix "${REVISION_SUFFIX}" \
        --output json

      echo "Container App update command completed."
    displayName: "Deploy to Azure Container Apps"

  - script: |
      set -euo pipefail

      MAX_ATTEMPTS=$(healthCheckMaxAttempts)
      INTERVAL=$(healthCheckIntervalSeconds)
      APP_NAME="$(containerAppName)"
      RG="$(resourceGroup)"

      echo "Waiting for latest revision to become healthy..."
      echo "  Max attempts: ${MAX_ATTEMPTS} (timeout: $((MAX_ATTEMPTS * INTERVAL))s)"

      for i in $(seq 1 "${MAX_ATTEMPTS}"); do
        HEALTH_STATE=$(az containerapp show \
          --name "${APP_NAME}" \
          --resource-group "${RG}" \
          --query "properties.latestRevisionHealthState" \
          --output tsv 2>/dev/null || echo "Unknown")

        REVISION_NAME=$(az containerapp show \
          --name "${APP_NAME}" \
          --resource-group "${RG}" \
          --query "properties.latestRevisionName" \
          --output tsv 2>/dev/null || echo "Unknown")

        echo "  Attempt ${i}/${MAX_ATTEMPTS}: revision=${REVISION_NAME}, health=${HEALTH_STATE}"

        if [ "${HEALTH_STATE}" = "Healthy" ]; then
          echo "Revision is healthy."
          break
        fi

        if [ "${HEALTH_STATE}" = "Degraded" ] || [ "${HEALTH_STATE}" = "Failed" ]; then
          echo "##vso[task.logissue type=error]Revision health state is '${HEALTH_STATE}'. Deployment may have failed."
          echo "Fetching revision details for diagnostics..."
          az containerapp revision show \
            --name "${APP_NAME}" \
            --resource-group "${RG}" \
            --revision "${REVISION_NAME}" \
            --output json || true
          exit 1
        fi

        if [ "${i}" -eq "${MAX_ATTEMPTS}" ]; then
          echo "##vso[task.logissue type=error]Health check timed out after $((MAX_ATTEMPTS * INTERVAL)) seconds."
          exit 1
        fi

        sleep "${INTERVAL}"
      done
    displayName: "Wait for revision to become healthy"

  - script: |
      set -euo pipefail

      APP_NAME="$(containerAppName)"
      RG="$(resourceGroup)"

      FQDN=$(az containerapp show \
        --name "${APP_NAME}" \
        --resource-group "${RG}" \
        --query "properties.configuration.ingress.fqdn" \
        --output tsv)

      REVISION=$(az containerapp show \
        --name "${APP_NAME}" \
        --resource-group "${RG}" \
        --query "properties.latestRevisionName" \
        --output tsv)

      echo "============================================"
      echo " Deployment complete"
      echo " App:      ${APP_NAME}"
      echo " Revision: ${REVISION}"
      echo " Image:    $(acrLoginServer)/$(imageName):${{ parameters.imageTag }}"
      echo " URL:      https://${FQDN}"
      echo " Health:   https://${FQDN}/health"
      echo "============================================"
    displayName: "Print deployment summary"
    condition: succeeded()
