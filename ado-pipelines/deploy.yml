# ado-pipelines/deploy.yml
#
# Deploy the NWRI eReferrals Service API to Azure Container Apps
#
# Prerequisites – the pipeline will FAIL EARLY with a clear message if these are not met:
#   • The Azure Container App ($(containerAppName)) must already exist in $(resourceGroup).
#     This pipeline only updates an existing app; it will NOT create one.
#     Provision the Container App via Bicep / Terraform before running this pipeline for the first time.
#   • The service connection ($(azureSubscription)) must have:
#       - Contributor (or Azure ContainerApps Contributor) on the Container App / resource group
#   • The Container App's own managed identity must have AcrPull on the ACR so it can pull the image at runtime.

trigger: none

parameters:
  - name: imageTag
    displayName: "Docker image tag to deploy (commit SHA or 'latest')"
    type: string
    default: "latest"

pool:
  name: UKS-DHCW-NWRI-DEV-ADOSelfHostPool

variables:
  - name: healthCheckMaxAttempts
    value: 30
  - name: healthCheckIntervalSeconds
    value: 10
  - group: nwri-ereferrals-dev

steps:
  - task: AzureCLI@2
    displayName: "Verify prerequisites"
    inputs:
      azureSubscription: $(azureSubscription)
      scriptType: "ps"
      scriptLocation: "inlineScript"
      inlineScript: |
        $ErrorActionPreference = 'Stop'

        Write-Host "Verifying that container app '$(containerAppName)' exists in resource group '$(resourceGroup)'..."
        az containerapp show `
          --name "$(containerAppName)" `
          --resource-group "$(resourceGroup)" `
          --output none `
          --only-show-errors

        if ($LASTEXITCODE -ne 0) {
          Write-Host "##vso[task.logissue type=error]Container app '$(containerAppName)' was not found in resource group '$(resourceGroup)'."
          Write-Host "##vso[task.logissue type=error]Provision the infrastructure (Bicep / Terraform) before running this pipeline for the first time."
          exit 1
        }

        Write-Host "Container app verified. Proceeding with deployment."

  - task: AzureCLI@2
    displayName: "Deploy to Azure Container Apps"
    inputs:
      azureSubscription: $(azureSubscription)
      scriptType: "ps"
      scriptLocation: "inlineScript"
      inlineScript: |
        $ErrorActionPreference = 'Stop'

        $imageRef       = "$(acrLoginServer)/$(imageName):${{ parameters.imageTag }}"
        $revisionSuffix = "v$(Build.BuildId)"

        Write-Host "============================================"
        Write-Host " Deploying to Container App"
        Write-Host " App:      $(containerAppName)"
        Write-Host " Image:    $imageRef"
        Write-Host " Revision: $revisionSuffix"
        Write-Host "============================================"

        az containerapp update `
          --name "$(containerAppName)" `
          --resource-group "$(resourceGroup)" `
          --image "$imageRef" `
          --revision-suffix "$revisionSuffix" `
          --output json `
          --only-show-errors

        if ($LASTEXITCODE -ne 0) {
          Write-Host "##vso[task.logissue type=error]az containerapp update failed."
          exit 1
        }

        Write-Host "Container App update command completed."

  - task: AzureCLI@2
    displayName: "Wait for revision to become healthy"
    inputs:
      azureSubscription: $(azureSubscription)
      scriptType: "ps"
      scriptLocation: "inlineScript"
      inlineScript: |
        $maxAttempts = [int]"$(healthCheckMaxAttempts)"
        $interval    = [int]"$(healthCheckIntervalSeconds)"
        $appName     = "$(containerAppName)"
        $rg          = "$(resourceGroup)"
        $timeoutSecs = $maxAttempts * $interval

        Write-Host "Waiting for latest revision to become healthy..."
        Write-Host "  Max attempts : $maxAttempts (timeout: ${timeoutSecs}s)"

        for ($i = 1; $i -le $maxAttempts; $i++) {
          # Single az call per iteration – parse both fields from the JSON response.
          $appJsonStr = az containerapp show `
            --name $appName `
            --resource-group $rg `
            --output json `
            --only-show-errors 2>$null

          if ($LASTEXITCODE -eq 0 -and $appJsonStr) {
            $appData      = $appJsonStr | ConvertFrom-Json
            $healthState  = $appData.properties.latestRevisionHealthState
            $revisionName = $appData.properties.latestRevisionName
          } else {
            $healthState  = "Unknown"
            $revisionName = "Unknown"
          }

          Write-Host "  Attempt $i/$maxAttempts : revision=$revisionName, health=$healthState"

          if ($healthState -eq "Healthy") {
            Write-Host "Revision is healthy."
            break
          }

          if ($healthState -eq "Degraded" -or $healthState -eq "Failed") {
            Write-Host "##vso[task.logissue type=error]Revision health state is '$healthState'. Deployment may have failed."
            if ($revisionName -ne "Unknown") {
              Write-Host "Fetching revision details for diagnostics..."
              az containerapp revision show `
                --name $appName `
                --resource-group $rg `
                --revision $revisionName `
                --output json `
                --only-show-errors
            }
            exit 1
          }

          if ($i -eq $maxAttempts) {
            Write-Host "##vso[task.logissue type=error]Health check timed out after $timeoutSecs seconds."
            exit 1
          }

          Start-Sleep -Seconds $interval
        }

  - task: AzureCLI@2
    displayName: "Print deployment summary"
    condition: succeeded()
    inputs:
      azureSubscription: $(azureSubscription)
      scriptType: "ps"
      scriptLocation: "inlineScript"
      inlineScript: |
        $ErrorActionPreference = 'Stop'

        $appName = "$(containerAppName)"
        $rg      = "$(resourceGroup)"

        $appJsonStr = az containerapp show `
          --name $appName `
          --resource-group $rg `
          --output json `
          --only-show-errors

        if ($LASTEXITCODE -ne 0) {
          Write-Host "##vso[task.logissue type=error]Failed to retrieve container app details for summary."
          exit 1
        }

        $appData  = $appJsonStr | ConvertFrom-Json
        $fqdn     = $appData.properties.configuration.ingress.fqdn
        $revision = $appData.properties.latestRevisionName

        Write-Host "============================================"
        Write-Host " Deployment complete"
        Write-Host " App:      $appName"
        Write-Host " Revision: $revision"
        Write-Host " Image:    $(acrLoginServer)/$(imageName):${{ parameters.imageTag }}"
        Write-Host " URL:      https://$fqdn"
        Write-Host " Health:   https://$fqdn/health"
        Write-Host "============================================"
