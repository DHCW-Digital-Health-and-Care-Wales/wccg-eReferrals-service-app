name: code-inspect.yml

on:
  workflow_dispatch:

jobs:
  code-inspect:
    runs-on: "ubuntu-latest"

    env:
      BUILD_CONFIGURATION: "Release"

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v6

      - name: "Setup .NET Core v8 SDK"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: "DotNet Restore"
        run: dotnet restore

      - name: "DotNet Build"
        run: dotnet build --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: "Restore DotNet Tools"
        run: dotnet tool restore

      - name: "Run Code Inspection"
        run: dotnet jb inspectcode NWRI.eReferralsService.sln -o="CodeInspectionReport.sarif.json"

      - name: "Upload Code Inspection Report"
        uses: actions/upload-artifact@v7
        with:
          name: code-inspection-report
          path: "${{ github.workspace }}/CodeInspectionReport.sarif.json"
          retention-days: 5
