trigger:
- none

pool:
  name: UKS-DHCW-NWRI-DEV-ADOSelfHostPool

steps:

- script: echo "Starting Hello World integration tests"
  displayName: "Start tests"

# Optional: keep your connectivity checks for consistency
- script: nc -zv uksdhcwdevnwriacr.azurecr.io 443
  displayName: 'Check connectivity to ACR'

# Get Container App URL
- task: AzureCLI@2
  displayName: "Fetch Container App URL"
  inputs:
    azureSubscription: 'Azure - NHSWales-DHCW-NWRI-Subscription'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |

      RG="UKSouth-DHCW-APP-DEV-NWRI-RG"
      APP_NAME="nwri-hello-world-app"

      echo "Fetching Container App FQDN..."

      FQDN=$(az containerapp show \
        --name $APP_NAME \
        --resource-group $RG \
        --query properties.configuration.ingress.fqdn \
        -o tsv)

      if [ -z "$FQDN" ]; then
        echo "Failed to retrieve FQDN"
        exit 1
      fi

      echo "FQDN: $FQDN"

      echo "##vso[task.setvariable variable=APP_URL]https://$FQDN"

# Wait for readiness (same logic as your deploy pipeline)
- task: AzureCLI@2
  displayName: "Wait for Container App readiness"
  inputs:
    azureSubscription: 'Azure - NHSWales-DHCW-NWRI-Subscription'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |

      RG="UKSouth-DHCW-APP-DEV-NWRI-RG"
      APP_NAME="nwri-hello-world-app"

      echo "Waiting for container app to become ready..."

      for i in {1..10}; do
        STATUS=$(az containerapp show \
          --name $APP_NAME \
          --resource-group $RG \
          --query "properties.latestRevisionHealthState" \
          -o tsv)

        echo "Current status: $STATUS"

        if [ "$STATUS" = "Healthy" ]; then
          echo "App is ready"
          break
        fi

        sleep 10
      done

# Test endpoint from agent
- script: |
    echo "======================================"
    echo "Calling Hello World endpoint"
    echo "URL: $(APP_URL)"
    echo "======================================"

    for i in {1..5}; do
      RESPONSE=$(curl -s $(APP_URL))

      echo "Attempt $i response:"
      echo "$RESPONSE"

    if [[ "$RESPONSE" == *"Hello"* ]] || [[ "$RESPONSE" == *"Azure Container Apps"* ]]; then
      echo "Endpoint returned expected content"
      exit 0
    fi


      echo "Retrying in 5 seconds..."
      sleep 5
    done

    echo "Endpoint test failed"
    exit 1

  displayName: "Validate Hello World endpoint"

# Example: how credentials would be used (template)
- script: |
    echo "Example of credential usage (not active)"

    echo "curl -H 'Authorization: Bearer $(API_TOKEN)' $(APP_URL)"

  displayName: "Credential usage example"
