pool:
  #name: NWRI-ADO-POOL
  name: UKS-DHCW-NWRI-DEV-ADOSelfHostPool

steps:

- script: echo "Hello, world!"
  displayName: 'Print Hello World'

- script: |
    echo "OS info:"
    cat /etc/os-release
    echo "apt-get location:"
    ls -l /usr/bin/apt-get || echo "not found"
    echo "PATH:"
    echo $PATH
  displayName: 'Verify environment'

- script: |
    which nc
    nc -h
  displayName: 'Verify netcat'
  
- script: echo "Testing ADO connectivity to all NWRI resources"
  displayName: 'Start connectivity tests'

- script: nc -zv uks-dhcw-dev-nwri-appconfig.azconfig.io 443
  displayName: 'Testing ADO connection to Application Configuration store'

- script: nc -zv uksdhcwdevnwriacr.azurecr.io 443
  displayName: 'Testing ADO connection to Azure Container Registry'

- script: nc -zv uks-dhcw-dev-nwri-kv.vault.azure.net 443
  displayName: 'Testing ADO connection to Azure Key Vault'

- script: nc -zv uksmydevnwriapp.internal.yellowtree-fadb23ed.uksouth.azurecontainerapps.io 443
  displayName: 'Testing ADO connection to NWRI Container App'

- script: nc -zv uksdhcwdevnwrisa.blob.core.windows.net 443
  displayName: 'Testing ADO connection to NWRI Storage Account'
   

- script: |
    terraform --version
  displayName: 'Check Terraform version'
   
- task: AzureCLI@2
  displayName: 'Deploy Hello World to Container Apps'
  inputs:
    azureSubscription: 'Azure - NHSWales-DHCW-NWRI-Subscription'   
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |

      set -e

      RG="UKSouth-DHCW-APP-DEV-NWRI-RG"
      APP_NAME="nwri-hello-world-app"
      ENV_NAME="uks-dhcw-dev-nwri-cae"
      LOCATION="uksouth"
      IMAGE="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"

      echo "Checking if Container App exists..."

      if az containerapp show --name $APP_NAME --resource-group $RG > /dev/null 2>&1
      then
        echo "App exists → updating image..."
        az containerapp update \
          --name $APP_NAME \
          --resource-group $RG \
          --image $IMAGE
      else
        echo "App does not exist → creating..."
        az containerapp create \
          --name $APP_NAME \
          --resource-group $RG \
          --environment $ENV_NAME \
          --image $IMAGE \
          --target-port 80 \
          --ingress internal
      fi

      echo "Fetching app URL..."

      FQDN=$(az containerapp show \
        --name $APP_NAME \
        --resource-group $RG \
        --query properties.configuration.ingress.fqdn \
        -o tsv)

      echo "======================================"
      echo " Container App deployed successfully!"
      echo " URL: https://$FQDN"
      echo "======================================"